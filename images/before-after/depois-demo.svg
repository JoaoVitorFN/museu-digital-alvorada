<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ilustração demonstrativa colorida de uma paisagem genérica">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFD6E2"/>
      <stop offset="1" stop-color="#EEF3EE"/>
    </linearGradient>
    <g id="arvore">
      <rect x="-7" y="0" width="14" height="52" fill="#5E4632"/>
      <circle cx="0" cy="-10" r="38" fill="#4F7F4A"/>
      <circle cx="-26" cy="14" r="26" fill="#5E9058"/>
      <circle cx="26" cy="14" r="26" fill="#5E9058"/>
    </g>
    <g id="predio">
      <rect x="0" y="0" width="110" height="100" fill="#EFE7D8" stroke="#6B5B4B" stroke-width="3"/>
      <rect x="14" y="14" width="22" height="22" fill="#7FA3B8"/>
      <rect x="44" y="14" width="22" height="22" fill="#7FA3B8"/>
      <rect x="74" y="14" width="22" height="22" fill="#7FA3B8"/>
      <rect x="14" y="48" width="22" height="22" fill="#7FA3B8"/>
      <rect x="74" y="48" width="22" height="22" fill="#7FA3B8"/>
      <rect x="44" y="62" width="22" height="38" fill="#6B4A33"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#ceu)"/>
  <circle cx="1230" cy="170" r="66" fill="#FBE9A8"/>

  <!-- colinas ao fundo (mesma linha do horizonte da imagem "antes") -->
  <path d="M0 520 C 200 465, 380 505, 560 480 S 980 445, 1200 490 S 1500 500, 1600 478 L1600 580 L0 580 Z" fill="#A9BBA0"/>
  <path d="M0 548 C 260 515, 520 545, 800 525 S 1340 520, 1600 540 L1600 600 L0 600 Z" fill="#8FA784"/>

  <!-- chão e estrada asfaltada -->
  <rect y="560" width="1600" height="340" fill="#7E9A6E"/>
  <polygon points="640,900 960,900 845,560 775,560" fill="#6A6A6A"/>
  <polygon points="792,900 808,900 812,560 808,560" fill="#EDEDED" opacity=".85"/>
  <rect x="0" y="560" width="1600" height="6" fill="#6F8A60"/>

  <!-- árvores genéricas (menos que no "antes") -->
  <use href="#arvore" transform="translate(170 640) scale(1.25)"/>
  <use href="#arvore" transform="translate(1500 600) scale(.9)"/>

  <!-- mais construções genéricas -->
  <use href="#predio" transform="translate(360 560) scale(1.1)"/>
  <use href="#predio" transform="translate(520 580) scale(.8)"/>
  <rect x="1000" y="585" width="130" height="78" fill="#EFE7D8" stroke="#6B5B4B" stroke-width="4"/>
  <polygon points="988,588 1065,534 1142,588" fill="#A5533A"/>
  <rect x="1048" y="618" width="32" height="45" fill="#6B4A33"/>
  <use href="#predio" transform="translate(1180 540) scale(1.3)"/>

  <!-- postes -->
  <g stroke="#4A3B2F" stroke-width="6">
    <line x1="700" y1="700" x2="700" y2="560"/>
    <line x1="900" y1="700" x2="900" y2="560"/>
    <line x1="680" y1="575" x2="720" y2="575"/>
    <line x1="880" y1="575" x2="920" y2="575"/>
    <line x1="700" y1="578" x2="900" y2="578" stroke-width="2"/>
  </g>

  <!-- marca d'água: deixa claro que NÃO é uma fotografia atual -->
  <g transform="rotate(-12 800 450)" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#2C211A">
    <text x="800" y="430" font-size="92" font-weight="700" opacity=".2">ILUSTRAÇÃO DEMONSTRATIVA</text>
    <text x="800" y="520" font-size="46" opacity=".2">não é fotografia atual</text>
  </g>
</svg>
